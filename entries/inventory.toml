abi = { args = ["ptr", "i32"], ret = "ptr" }
thread = "any"
doc = "A slot of the container by position, or zero past its size; the items are 72 bytes each."

[field."inventory.inventory_container.items"]
of = "inventory.inventory_container"
type = "ptr"
locator = { in = "inventory.inventory_container.get_inventory_slot", signature = "4C 8B 41 ??", operand = "disp" }
# Slots of 72 bytes: the index times 9, scaled by 8.
checks = [{ contains = "48 8D 0C C0 41 80 7C C8 ?? 00 49 8D 1C C8", in = "inventory.inventory_container.get_inventory_slot" }]
doc = "The container's slots."

[field."inventory.inventory_container.kind"]
