[function."inventory.inventory_manager.get_inventory_container"]
locator = { signature = "48 89 5C 24 08 57 48 83 EC 20 8B DA 48 8B F9 E8 ?? ?? ?? ?? 84 C0 74 ?? E8 ?? ?? ?? ?? 8B D3" }
abi = { args = ["ptr", "u32"], ret = "ptr" }
thread = "main"
doc = "The container of an inventory type, or zero: finds the type among the 84 containers' types, then checks that the container has items."

[field."inventory.inventory_manager.inventories"]
of = "inventory.inventory_manager"
type = "ptr"
locator = { in = "inventory.inventory_manager.get_inventory_container", signature = "48 8B 97 ?? ?? ?? ?? 48 85 D2", operand = "disp" }
# 84 containers (cmp ax, 54h) of 32 bytes (shl rcx, 5).
checks = [
    { contains = "66 83 F8 54 72", in = "inventory.inventory_manager.get_inventory_container" },
    { contains = "48 C1 E1 05 48 83 7C 11 08 00 48 8D 04 11", in = "inventory.inventory_manager.get_inventory_container" },
]
doc = "The containers: an array of 84 containers of 32 bytes each."

[vtable."inventory.inventory_container"]
