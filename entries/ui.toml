    { contains = "BE 07 00 00 00 45 33 ED 66 0F 1F 84 00 00 00 00 00 8D 5E F9 83 FB 14 0F 83 ?? ?? ?? ?? 8D 4E FE 48 C1 E1 04" },
    { contains = "8D 4E 12 FF 85 ?? ?? ?? ?? 48 C1 E1 04" },
]
doc = "Opens the System menu: (HUD agent, the values of the main menu bar's event, number of entries). Each entry is a MainCommand row in an int value and, when that value's text is set, the text shown for it."
