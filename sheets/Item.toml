sheet = "Item"
doc = "Every item: its names, description, icon, and rarity."

[columns.singular]
type = "text"
doc = "The name in the singular, lower-case where the language allows, as text uses it inside sentences."

[columns.plural]
type = "text"
doc = "The name in the plural, as text uses it inside sentences."

[columns.description]
type = "text"
doc = "The description shown in the item's tooltip."

[columns.name]
type = "text"
doc = "The name as menus and tooltips show it."

[columns.icon]
type = "uint16"
doc = "The item's icon: an icon number."

[columns.rarity]
type = "uint8"
doc = "How rare the item is, which colors its name: 1 common (white), 2 uncommon (green), 3 rare (blue), 4 relic (purple), 7 aetherial (pink); 0 for a row without an item."

[columns.equip_slot]
type = "uint8"
doc = "Where the item is worn or held: a row of EquipSlotCategory; 0 for an item that is not worn."

