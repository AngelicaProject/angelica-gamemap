[events.action_used]
doc = "The player asked to use an action: from a hotbar, a menu, a macro, or the duty finder; the game may still refuse it or queue it."
at = "action.action_manager.use_action"
domain = "actions"
rate = 32

[events.action_used.args.kind]
doc = "The kind of action."
arg = 1
enum = "action.action_type"

[events.action_used.args.action]
doc = "The action's id: a row of the Action sheet for an action, of the Item sheet for an item, of the GeneralAction sheet for a general action, and so on by kind."
arg = 2

[events.action_used.args.target]
doc = "The game object id of the intended target; 0xE0000000 without one."
arg = 3

[events.action_used.args.extra]
doc = "For an item, its container in the high byte and its slot in the low byte, or 0xFFFF from a hotbar."
arg = 4

[events.chat_message_added]
doc = "The game adds a message to the chat log: a player's message, a system message, a battle line. A rule may hide it."
at = "ui.log_module.print_message"
domain = "chat"
rate = 64

[events.chat_message_added.args.kind]
doc = "The kind of message: a row of the LogKind sheet, such as 57 for system messages."
arg = 1
mask = 0x7F

[events.chat_message_added.args.sender]
doc = "Who sent the message: a player's name with its links; empty for a message without a sender."
arg = 2
ref = "text.utf8_string"

[events.chat_message_added.args.message]
doc = "The message."
arg = 3
ref = "text.utf8_string"

[events.chat_message_added.args.timestamp]
doc = "When the message was sent, in seconds since 1970; 0 for now."
arg = 4

[events.chat_message_added.outcomes.hide]
doc = "The message is not added to the chat log, as when no chat tab shows its kind. Checked in 2026.10.06: the function returns 0 on that path itself."
returns = 0

[events.sheet_text]
doc = "A text cell of a row of one of the game's sheets, as the game stores the row it read, before anything in the game sees it: names, descriptions, dialogue. The host derives one per cell at both row stores of the sheets (also excel.ring_buffer_page_row_resolver.store_row)."
at = "excel.hash_table_page_row_resolver.store_row"
derived = "sheet_cell"
domain = "text"
rules = "text-table-v1"

[events.sheet_text.args.sheet]
doc = "The sheet's name, such as Item."
from = "sheet"
text = 256

[events.sheet_text.args.language]
doc = "The game language of the sheet's rows, as the game numbers its languages; 0 for a sheet without one."
from = "language"

[events.sheet_text.args.row]
doc = "The row's id."
from = "row"

[events.sheet_text.args.subrow]
doc = "The subrow's id; 0 in a sheet without subrows."
from = "subrow"

[events.sheet_text.args.column]
doc = "The column's position among all of the sheet's columns."
from = "column"

[events.sheet_text.args.text]
doc = "The cell's text as the game has it, its macros encoded."
from = "text"
text = 4096

[events.sheet_text.outcomes.replace]
doc = "The cell holds the rule's text instead, for everything in the game that reads the row."
text = 65535

[events.letter_upper]
doc = "A letter beyond ASCII that the game's conversion to capital letters meets where its rules capitalize: the first letter, every word's, or every letter, outside excluded words."
at = "text.utf8_string.to_upper"
derived = "case_letter"
domain = "text"

[events.letter_upper.args.letter]
doc = "The letter, in UTF-8."
from = "letter"
text = 4

[events.letter_upper.outcomes.becomes]
doc = "The conversion gives the rule's letter, of the same length in UTF-8."
text = 4
same_length = "letter"

[events.letter_lower]
doc = "A letter beyond ASCII that the game's conversion to small letters meets."
at = "text.utf8_string.to_lower"
derived = "case_letter"
domain = "text"

[events.letter_lower.args.letter]
doc = "The letter, in UTF-8."
from = "letter"
text = 4

[events.letter_lower.outcomes.becomes]
doc = "The conversion gives the rule's letter, of the same length in UTF-8."
text = 4
same_length = "letter"
