[types."ui.stage"]
doc = "The stage that owns the game's windows."
domain = "windows"

[types."ui.stage".fields.unit_manager]
doc = "The manager of the game's windows."
ref = "ui.unit_manager"

[types."ui.unit_manager"]
doc = "The manager of the game's windows."
domain = "windows"

[types."ui.unit_manager".fields.unit_count]
doc = "How many windows are loaded."

[types."ui.unit_manager".fields.windows]
doc = "The loaded windows, open or hidden."
at = "ui.unit_manager.units"
array = { of = "ui.unit_base", count = "unit_count", most = 256, stride = 8, pointers = true }

[types."ui.unit_base"]
doc = "One of the game's windows."
domain = "windows"

[types."ui.unit_base".fields.name]
doc = "The window's name in the game, such as SelectYesno."
text = 32

[types."ui.unit_base".fields.value_count]
doc = "How many values the window has."

[types."ui.unit_base".fields.values]
doc = "The window's values: what the game filled it with, such as a dialog's question and its choices."
array = { of = "ui.atk_value", count = "value_count", most = 512, stride = 16 }

[types."ui.atk_value"]
doc = "One value of a window."
domain = "windows"

[types."ui.atk_value".fields.kind]
doc = "What the value holds."
enum = "ui.atk_value_kind"

[types."ui.atk_value".fields.integer]
doc = "The value, for the kind int."

[types."ui.atk_value".fields.unsigned]
doc = "The value, for the kind uint."

[types."ui.atk_value".fields.text]
doc = "The text, for the kinds string, const_string, and managed_string."
text = 1024

[types."ui.unit_base".fields.layout]
doc = "The window's elements, as its layout file builds them."
at = "ui.unit_base.widget"
ref = "ui.widget_info"

[types."ui.widget_info"]
doc = "The elements of a window, as its layout file builds them."
domain = "windows"

[types."ui.widget_info".fields.element_count]
doc = "How many elements the window has."
at = "ui.widget_info.node_count"

[types."ui.widget_info".fields.elements]
doc = "The window's elements: images, text, and groups of others. The window schemas of the map name some of them."
at = "ui.widget_info.nodes"
array = { of = "ui.res_node", count = "element_count", most = 1024, stride = 8, pointers = true }

[types."ui.res_node"]
doc = "An element of a window: an image, text, or a group of others."
domain = "windows"

[types."ui.res_node".fields.name]
doc = "The element's name in the window schema of its window; an element the schema does not name is a number."
at = "ui.res_node.id"
element = "ui.unit_base.name"

[types."ui.res_node".fields.kind]
doc = "What the element is."
at = "ui.res_node.type"
enum = "ui.node_type"

[types."ui.res_node".fields.visible]
doc = "Whether the element is shown. The game shows and hides elements itself, so a plugin's value is held."
at = "ui.res_node.flags"
bit = 20
set = { call = "ui.res_node.set_visible", hold = true }

[types."ui.text_node"]
doc = "An element of a window that shows text."
domain = "windows"
extends = "ui.res_node"
variant = { field = "kind", values = ["text"] }

[types."ui.text_node".fields.text]
doc = "The text the element shows, its macros encoded. The game writes it again itself, so a plugin's text is held."
pointer = "text.utf8_string.string_ptr"
text = 4096
set = { call = "ui.text_node.set_text", hold = true }
