# The domains of the object model: what a plugin asks the player to read.
# The maintainer approves each domain and its wording once; fields and types
# join a domain without a new approval.

[domains.character]
doc = "The player's character: name, class, level, HP, and MP."
class = "you"
read = { en = "See your character: name, class, level, HP and MP", ru = "Видеть вашего персонажа: имя, класс, уровень, HP и MP" }

[domains.location]
doc = "Where the player is: the zone and the position in it."
class = "you"
read = { en = "See where you are: the zone and your position", ru = "Видеть, где вы: зону и место в ней" }

[domains.statuses]
doc = "The statuses on the player's character."
class = "you"
read = { en = "See the statuses on your character", ru = "Видеть эффекты на вашем персонаже" }

[domains.inventory]
doc = "The items the player carries: the bags, the equipped gear, the currency, the crystals, and the key items."
class = "you"
read = { en = "See the items you carry", ru = "Видеть предметы, которые вы носите" }

[domains.armoury]
doc = "The armoury chest."
class = "you"
read = { en = "See your armoury chest", ru = "Видеть ваш оружейный сундук" }

[domains.saddlebag]
doc = "The chocobo saddlebags."
class = "you"
read = { en = "See your chocobo saddlebags", ru = "Видеть седельные сумки вашего чокобо" }

[domains.retainers]
doc = "What the player's retainers hold, while the player has a retainer's inventory open."
class = "you"
read = { en = "See what your retainers hold", ru = "Видеть, что хранят ваши ретейнеры" }

[domains.actions]
doc = "The actions the player uses: abilities, spells, items, mounts, and the others the action bars hold."
class = "you"
read = { en = "See the actions you use", ru = "Видеть действия, которые вы используете" }
act = { en = "Use actions for you: abilities, spells, items, mounts", ru = "Использовать действия за вас: способности, заклинания, предметы, ездовых животных" }

[domains.activity]
doc = "What the player's character is doing: in combat, casting, mounted, busy, between areas."
class = "you"
read = { en = "See what you are doing: in combat, casting, mounted, busy", ru = "Видеть, чем вы заняты: бой, чтение заклинания, верховая езда, занятость" }

[domains.teleport]
doc = "Teleporting to aetherytes."
class = "you"
read = { en = "See where you teleport", ru = "Видеть, куда вы телепортируетесь" }
act = { en = "Teleport you to aetherytes, paying the fee", ru = "Телепортировать вас к эфиритам, оплачивая перелёт" }

[domains.camera]
doc = "The player's camera: how far it is, its zoom limits, and where it faces."
class = "display"
read = { en = "See your camera: zoom and direction", ru = "Видеть вашу камеру: приближение и направление" }
change = { en = "Change your camera's zoom limits", ru = "Менять пределы приближения вашей камеры" }

[domains.chat]
doc = "The chat log: the messages the player and other players send, and the game's own."
class = "others"
read = { en = "See your chat log, including other players' messages", ru = "Видеть ваш чат, включая сообщения других игроков" }
change = { en = "Hide messages in your chat log", ru = "Скрывать сообщения в вашем чате" }

[domains.windows]
doc = "The game's windows: which are open and what they show and ask, which may name other players."
class = "others"
read = { en = "See the game's windows and what they ask, including other players' names", ru = "Видеть окна игры и их вопросы, включая имена других игроков" }
act = { en = "Answer the game's dialogs for you", ru = "Отвечать на диалоги игры за вас" }
change = { en = "Hide parts of the game's windows and put its own text in them", ru = "Скрывать части окон игры и вписывать в них свой текст" }

[domains.text]
doc = "The game's own text: what its sheets hold, such as names, descriptions, and dialogue, and how it converts letter case."
class = "display"
read = { en = "See the game's text: names, descriptions, dialogue", ru = "Видеть тексты игры: названия, описания, диалоги" }
change = { en = "Change the game's text: names, descriptions, dialogue, letter case", ru = "Менять тексты игры: названия, описания, диалоги, регистр букв" }

[domains.fitting]
doc = "The Try On window, which shows items on the player's character and changes nothing else."
class = "you"
read = { en = "See what you try on", ru = "Видеть, что вы примеряете" }
act = { en = "Open items in the Try On window", ru = "Открывать предметы в окне примерки" }
act_local = true
